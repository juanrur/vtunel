services:
  db:
    build: ./db
    volumes:
      - pb_data:/pb/pb_data
    env_file:
      - .env
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        POCKETBASE_URL: http://db:8080
    env_file:
      - .env
    environment:
      - POCKETBASE_URL=http://db:8080
    depends_on:
      - db
    restart: unless-stopped

volumes:
  pb_data:
